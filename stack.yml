services:
  backend:
    image: backend-hackathon-2026:1.0.0
    build: ./backend
    env_file:
      - .env
    depends_on:
      - database
    ports:
      - 8000:8000

  database:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    image: frontend-hackathon-2026:1.0.0
    build: ./frontend
    ports:
      - 8080:8080

volumes:
  postgres_data:
    name: hackathon_postgres_data
