api:
  insecure: true

providers:
  docker:
    exposedByDefault: false
    network: hackathon-2026-public
  file:
    directory: /etc/traefik/dynamic
    watch: true

entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: :443
    http:
      tls: { }
